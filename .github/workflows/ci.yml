name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run build
      - name: Verify stamped assets
        shell: bash
        run: |
          grep -q 'assets/app.js?v=' index.html
          grep -q 'assets/app.css?v=' index.html
          test -f assets/app.js
          test -f assets/app.css
